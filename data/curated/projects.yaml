# Major public works in the district that involve federal money.
# Every fact names the official page it was read from. Re-read the pages by review_by and
# update the dates; project schedules move.
verified_on: 2026-11-24
review_by: 2027-03-15
projects:
  - id: blatnik-bridge
    title: Blatnik Bridge replacement
    place: Superior, Wisconsin, to Duluth, Minnesota
    county: Douglas
    summary: >-
      The John A. Blatnik Bridge carries Interstate 535 over St. Louis Bay between Superior and
      Duluth. The Minnesota and Wisconsin transportation departments own it jointly and are
      replacing it on the same alignment. Minnesota leads the project.
    links:
      - {label: "Minnesota DOT project page (lead agency)", url: "https://www.dot.state.mn.us/d1/projects/blatnik-bridge/"}
      - {label: "Wisconsin DOT project page", url: "https://wisconsindot.gov/Pages/projects/by-region/nw/blatnikbridge/default.aspx"}
    facts:
      - {label: Estimated cost, value: "$1.8 billion", note: "Including inflation; estimate published in 2024.", source: wisdot-blatnik-faq}
      - {label: Federal grant, value: "$1.058 billion", note: "Awarded in early 2024 under the federal infrastructure law.", source: wisdot-blatnik-faq}
      - {label: Each state's share, value: "Up to $400 million", note: "Minnesota and Wisconsin split the rest equally.", source: wisdot-blatnik-faq}
      - {label: Vehicles a day, value: "About 33,000", note: null, source: wisdot-blatnik-faq}
      - {label: Full closure, value: "No earlier than March 1, 2027", note: null, source: mndot-blatnik-2026-10-30}
      - {label: Length of closure, value: "Four to five years", note: null, source: wisdot-blatnik-page}
      - {label: New bridge opens, value: "By October 31, 2031", note: "Overall completion in 2032.", source: mndot-blatnik-2026-10-30}
    timeline:
      - {date: "December 1961", text: "The bridge opened to traffic.", source: wisdot-blatnik-faq}
      - {date: "Early 2024", text: "The two states received the federal grant.", source: wisdot-blatnik-faq}
      - {date: "Fall 2026", text: "Lane changes, traffic signal work, and new pavement markings are planned on Belknap Street (U.S. 2) in Superior ahead of the closure. The contractor is Ames-Kraemer Joint Venture II.", source: mndot-blatnik-2026-10-30}
      - {date: "Before the closure", text: "Wisconsin is improving Winter Street and Susquehanna Avenue in Superior as alternate routes. Its part of the project also replaces the I-535 and Highway 35 interchange and rebuilds a segment of U.S. 53.", source: wisdot-blatnik-page}
      - {date: "March 1, 2027, at the earliest", text: "Full closure, so crews can remove the existing bridge.", source: mndot-blatnik-2026-10-30}
      - {date: "October 31, 2031", text: "Date by which the new bridge is scheduled to open.", source: mndot-blatnik-2026-10-30}
