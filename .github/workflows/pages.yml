# Publish site/ with the latest data to GitHub Pages.
name: Deploy to Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          rm -rf _site/data
          mkdir -p _site/data
          if [ -d data/wi-07 ]; then cp -R data/wi-07/. _site/data/; fi
          touch _site/.nojekyll
      - name: Refuse to publish sample data
        run: |
          if grep -rl '"sample": *true' _site/data 2>/dev/null; then
            echo "Sample data found in the published site. Aborting." && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
