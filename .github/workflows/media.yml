# Render the README hero animation, the tour video, screenshots, and the
# social card from the live site code and current data.
name: Render media

on:
  workflow_dispatch:
  schedule:
    - cron: "41 12 3 * *"   # monthly, after a data refresh

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg webp
      - name: Render
        run: python tools/render_media.py
      - name: Refresh README (it embeds the new media)
        run: python -m pipeline readme
      - name: Commit media
        run: |
          git config user.name "wi7-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media site/media README.md
          git diff --cached --quiet || (git commit -m "Render media $(date -u +%Y-%m-%d)" && git push)

  deploy:
    needs: render
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
