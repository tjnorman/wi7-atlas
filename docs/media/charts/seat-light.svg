<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="t d"><title id="t">Who has held the seat</title><desc id="d">Timeline of members who have represented the district.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #1d1d1f; }
  .muted { fill: #6e6e73; }
  .faint { fill: #86868b; }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 14px; }
  .label { font-size: 13px; }
  .small { font-size: 11px; }
  .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .rise { transform-box: fill-box; transform-origin: center bottom; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade .9s ease-out both; }
  .draw { stroke-dasharray: 4000; stroke-dashoffset: 4000; animation: draw 2.4s cubic-bezier(.4,0,.2,1) .2s forwards; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .grow, .rise, .fade { animation: none; }
    .draw { animation: none; stroke-dashoffset: 0; }
  }
</style>
<text x="24.0" y="44.0" class="title" text-anchor="start" >Who has held the seat</text><text x="24.0" y="70.0" class="sub muted" text-anchor="start" >Members since 1953. The seat follows the district, whose lines were redrawn after each census.</text><g class="grow" style="animation-delay:0.00s"><rect x="40.1" y="110.0" width="212.1" height="42.0" rx="6" fill="#c9453b" fill-opacity="1.0" class=""/></g><text x="42.1" y="176.0" class="label" text-anchor="start" >Melvin Laird</text><text x="42.1" y="194.0" class="small muted" text-anchor="start" >1953-1971 · Republican</text><g class="grow" style="animation-delay:0.15s"><rect x="230.4" y="110.0" width="497.5" height="42.0" rx="6" fill="#2f66c9" fill-opacity="1.0" class=""/></g><text x="232.4" y="176.0" class="label" text-anchor="start" >David Obey</text><text x="232.4" y="194.0" class="small muted" text-anchor="start" >1969-2011 · Democrat</text><g class="grow" style="animation-delay:0.30s"><rect x="729.9" y="110.0" width="101.6" height="42.0" rx="6" fill="#c9453b" fill-opacity="1.0" class=""/></g><text x="731.9" y="176.0" class="label" text-anchor="start" >Sean P. Duffy</text><text x="731.9" y="194.0" class="small muted" text-anchor="start" >2011-2019 · Republican</text><g class="grow" style="animation-delay:0.45s"><rect x="841.3" y="110.0" width="76.8" height="42.0" rx="6" fill="#c9453b" fill-opacity="1.0" class=""/></g><line x1="918.1" y1="154.0" x2="918.1" y2="206.0" stroke="#86868b" stroke-width="1" stroke-opacity="1.0"/><text x="918.1" y="222.0" class="label" text-anchor="end" >Thomas P. Tiffany</text><text x="918.1" y="240.0" class="small muted" text-anchor="end" >2020-2027 · Republican</text><text x="123.2" y="100.0" class="small faint" text-anchor="middle" >1960</text><text x="242.2" y="100.0" class="small faint" text-anchor="middle" >1970</text><text x="361.1" y="100.0" class="small faint" text-anchor="middle" >1980</text><text x="480.0" y="100.0" class="small faint" text-anchor="middle" >1990</text><text x="598.9" y="100.0" class="small faint" text-anchor="middle" >2000</text><text x="717.8" y="100.0" class="small faint" text-anchor="middle" >2010</text><text x="836.8" y="100.0" class="small faint" text-anchor="middle" >2020</text><text x="24.0" y="274.0" class="small faint" text-anchor="start" >Sources: congress-legislators (The @unitedstates project), cross-checked with the Clerk of the U.S. House.</text></svg>
